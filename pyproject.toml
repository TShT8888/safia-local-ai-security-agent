[project]
name = "safia-local-ai-security-agent"
version = "0.1.0"
description = "A local AI security agent case study for reviewing codebases and explaining likely vulnerabilities."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Case Study Candidate" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
safia-sec-agent = "safia_security_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
